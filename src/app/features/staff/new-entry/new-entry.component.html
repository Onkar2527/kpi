<div class="container mt-4 pb-5">
  <div class="card shadow-sm border rounded-3 animate__animated animate__fadeIn">
    <div class="card-header bg-white py-3">
      <h4 class="fw-bold mb-0 text-dark">Add Entry</h4>
    </div>

    <div class="card-body p-4 bg-white">
      <!-- Alert Panel -->
      <div *ngIf="error" class="alert alert-danger d-flex align-items-center mb-4 rounded-3 p-3">
        <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
        <div>{{ error }}</div>
      </div>

      <form (ngSubmit)="onSubmit()" class="needs-validation">
        
        <div class="row">
          <!-- KPI Type -->
          <div class="col-md-6 mb-4">
            <label for="kpi" class="form-label fw-semibold mb-2">KPI Type</label>
            <select id="kpi" class="form-select form-select-lg rounded-3" [(ngModel)]="kpi" (change)="onKpiChange()" name="kpi" required>
              <option value="" disabled selected>-- Select KPI --</option>
              <option *ngFor="let option of kpiOptions" [value]="option">
                {{ kpiDisplayNames[option] }}
              </option>
            </select>
          </div>

          <!-- Allocation Type -->
          <div class="col-md-6 mb-4">
            <label for="typeOfDeposit" class="form-label fw-semibold mb-2">Allocation Type</label>
            <select id="typeOfDeposit" class="form-select form-select-lg rounded-3" [(ngModel)]="typeOfDeposit" name="typeOfDeposit" required>
              <option value="" disabled selected>-- Select Option --</option>
              <option *ngFor="let option of typeOfDepositOptions" [value]="option">
                {{ option }}
              </option>
            </select>
          </div>
        </div>

        <div class="row">
          <!-- Account Number (Conditional) -->
          <div class="col-md-6 mb-4" *ngIf="kpi !== 'loan_amulya' && typeOfDeposit !== 'Combined'">
            <label for="accountNumber" class="form-label fw-semibold mb-2">Account Number</label>
            <input type="text" class="form-control form-control-lg rounded-3" id="accountNumber" [(ngModel)]="accountNo" name="accountNo" maxlength="14" placeholder="Enter 13 or 14-digit Account No" (input)="allowOnlyNumbers($event)">
          </div>

          <!-- Operation Type -->
          <div class="col-md-6 mb-4" [ngClass]="(kpi !== 'loan_amulya' && typeOfDeposit !== 'Combined') ? '' : 'col-md-12'">
            <label for="type" class="form-label fw-semibold mb-2">Operation Type</label>
            <select id="type" class="form-select form-select-lg rounded-3" [(ngModel)]="type" name="type" required>
              <option value="" disabled selected>-- Select Operation --</option>
              <option *ngFor="let op of typeOptions" [value]="op">
                {{ op }}
              </option>
            </select>
          </div>
        </div>

        <div class="row">
          <!-- Value / Number of Accounts -->
          <div class="col-md-6 mb-4">
            <label for="value" class="form-label fw-semibold mb-2">
              {{ kpi === 'loan_amulya' ? 'Number of Accounts' : 'Value' }}
            </label>
            <input type="number" class="form-control form-control-lg rounded-3" id="value" [(ngModel)]="value" name="value" placeholder="Enter value or count" required>
          </div>

          <!-- Date -->
          <div class="col-md-6 mb-4">
            <label for="date" class="form-label fw-semibold mb-2">Transaction Date</label>
            <input type="date" class="form-control form-control-lg rounded-3" id="date" [(ngModel)]="date" name="date" [max]="maxDate" required>
          </div>
        </div>

        <!-- Action Button -->
        <div class="row mt-4">
          <div class="col-md-4 offset-md-4 d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-3 shadow-sm" [disabled]="isSubmitted">
              <span *ngIf="isSubmitted" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ isSubmitted ? 'Submitting...' : 'Submit' }}
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
